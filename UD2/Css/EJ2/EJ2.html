<!DOCTYPE html>
<html lang='en'>
    <head>
        <meta charset='utf-8'>
        <title>EJ2CSS</title>
        <style type="text/css">
            h1,p{
                text-align: center;
                color:blue
            }
            .important{
                color:red
            }
            body{
                background:pink
            }

        </style>
    </head>
    <body>
        <h1><span >Texto </span><span class="important">centrado</span><span >.</span></h1>
        <p style="background:silver;">Texto centrado sobre fondo de color plata.</p>
        <p style="text-align: right;"> Texto <span class="important">alineado</span> a la derecha.</p>
        <p style="background:silver;">Otro texto centrado sobre fondo de color plata.</p>
    </body>
</html>
