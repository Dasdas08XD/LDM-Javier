<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Sombras textos CSS</title>
        <style>
		/* no borrar */
			p{
				border-color: red;
			}
			p{ 
				font-size: 2em; 
				margin: 1em; 
				padding: 0 5px; 
				}
			h1{
				font-family: fira;
				font-size: 36px;
				margin-left: 2em;
				margin-bottom: 1em; 
				color: blue;
			}

        </style>
    </head>
    <body>
		<main>
			<p style="text-shadow: 2px 2px  grey ;color:green">Las sombras de texto fueron definidas en 1997</p>
			<p style="text-shadow: -1px -1px 5px red, 2px 2px 3px black; color:black" >Las sombras de texto fueron definidas en 1997</p>
			<p style="text-shadow: -3px -3px 3px red, 3px 3px 3px blue">Las sombras de texto fueron definidas en 1997</p>
			<p>Las sombras de texto fueron definidas en 1997</p>
			<p>Las sombras de texto fueron definidas en 1997</p>
			<p>Las sombras de texto fueron definidas en 1997</p>		
		</main>
    </body>
</html>
