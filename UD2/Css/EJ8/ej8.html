<html>
    <head>
        <title>Ejercicio de pseudo-clases</title>
        </head>
        <style type="text/css">
            @font-face{
                font-family:"dovazhul";
                src: url(dragon_alphabet.ttf);
            }
            body{
                font-family:dovazhul;
            }
            li:nth-child(1){
                color:blue;
            }
            li:nth-child(even){
                color:red;
                font-size:40px;
            }
            li:nth-child(3){
                color:orange;
            }
            li:nth-last-child(1){
                color:green;
                font-size: 50px;
            }
        </style>
    <body>
        <ul>
        <li>Primero</li>
        <li>Segundo</li>
        <li>Tercero</li>
        <li>Cuarto</li>
        <li>Quinto</li>
        </ul>
        <p>guingauliguliwaka</p>
    </body>
</html>
