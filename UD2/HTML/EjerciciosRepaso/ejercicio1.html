<!DOCTYPE html>
<!--La declaración <!DOCTYPE html> sirve para indicarle al navegador web que el documento está escrito en HTML5 y que debe renderizarlo utilizando el modo estándar.-->
<html lang="Es">
    <head>
        <meta charset="UTF-8">
        <title>Sintaxis y Caracteres Especiales</title>
    </head>
    <body>
        <p>
            En HTML5, la etiqueta &lt;section &gt;  sirve para agrupar contenido temático, mientras que &lt; article &gt; representa contenido independiente. Recuerda que no se deben olvidar entidades como &ampamp; para el carácter &.
        </p>
    </body>
</html>
