<!DOCTYPE html>
<html lang='Es'>
<head>
    <meta charset='UTF-8'>
    <title>Formularios</title>
</head>
<body>
    <form action="validar.php" method="get">
        <fieldset>
            <legend>Para datos personales </legend>
            <label for="Teléfono">Teléfono</label>
            <input type="tel" id="tel" name="tel" placeholder="9 números" autocomplete="mobile" maxlength="9">
            <br>
            <label for="Email">Correo electrónico</label>
            <input type="text" id="Email" name="Email" placeholder="El formato correcto es nombre+@+servidor de correo" maxlength="50" size="50" autocomplete="email">
        </fieldset>

        <fieldset>
            <legend>Para valores númericos</legend>
            <label for="Número personas"> Número de personas</label>
            <input type="number" id="personas" name="personas" min="1" max="20" step="1" value="1">
            <br>
            <label for="puntuacion">Desplace la barra para indicar puntuación (De 1 a 10):</label>
            <input type="range" id="puntuacion" name="puntuacion" min="1" max="10" step="1" value="0">
        </fieldset>

        <fieldset>
            <legend>Url y búsqueda</legend>
            <label for="url">Url:</label>
            <input type="url" id="url" name="url" placeholder="http://..." pattern="https?://.+">
            <br>
            <label for="busqueda">¿Qué te interesa buscar?</label>
            <input type="search" id="busqueda" name="busqueda">
        </fieldset>

        <fieldset>
            <legend>Otros tipos</legend>
            <label for="color">Color</label>
            <input type="color" id="color" name="color">
        </fieldset>

        <fieldset>
            <legend>Para fechas</legend>
            <label for="dia">Seleccione un día (Hasta fin de año):</label>
            <input type="date" id="dia" name="dia" max="2026-12-31">
            <br>
            <label for="hora">Seleccione una hora:</label>
            <input type="time" id="hora" name="hora">
            <br>
            <label for="mes">Seleccione un mes:</label>
            <input type="month" id="mes" name="mes">
            <br>
            <label for="semana">Seleccione una semana:</label>
            <input type="week" id="semana" name="semana">
            <br>
            <label for="fechahora">Seleccione fecha y hora:</label>
            <input type="datetime-local" id="fechahora" name="fechahora">
        </fieldset>
        <br>
        
        <button type="submit" formaction="nueva_validacion.php">
            <img src="aceptar_50_50.png" alt="Validar" width="50" height="50">
        </button>
        
        <button type="reset">
            <img src="limpiar_50_50.jpg" alt="Limpiar" width="50" height="50">
        </button>
    
</body>
</html>
